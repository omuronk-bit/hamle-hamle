<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamle Hamle</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F1F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F171D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hamle Hamle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --paper:#F1F3EF; --surface:#FBFCFA; --ink:#17222A; --ink-2:#4A5862; --ink-3:#77848E;
  --line:#D4DAD4; --line-2:#E5E9E4; --pen:#2848A8; --pen-ink:#FFFFFF; --pen-2:#E2E7F6;
  --flag:#B53A26; --flag-2:#F6E1DC; --ok:#2B7550; --ok-2:#DCEEE3; --amber:#B4750F;
  --sq-l:#E7E5D6; --sq-d:#5E8A6C; --sq-lm:rgba(236,196,60,.5); --sq-sel:rgba(40,72,168,.38);
  --pwf:#F8F7F2; --pws:#1C2329; --pbf:#272D34; --pbs:#0B0F12; --pbd:#D7DBDE;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:6px; --r-m:10px; --r-l:16px;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F171D; --surface:#151F27; --ink:#E4EAED; --ink-2:#A2B1BA; --ink-3:#71808A;
    --line:#27343E; --line-2:#1D2932; --pen:#93A8FF; --pen-ink:#0F171D; --pen-2:#1E2A4A;
    --flag:#FF8C76; --flag-2:#3A201B; --ok:#68CC97; --ok-2:#16301F; --amber:#E7B04A;
    --sq-l:#CDCBBD; --sq-d:#4D795C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F171D; --surface:#151F27; --ink:#E4EAED; --ink-2:#A2B1BA; --ink-3:#71808A;
  --line:#27343E; --line-2:#1D2932; --pen:#93A8FF; --pen-ink:#0F171D; --pen-2:#1E2A4A;
  --flag:#FF8C76; --flag-2:#3A201B; --ok:#68CC97; --ok-2:#16301F; --amber:#E7B04A;
  --sq-l:#CDCBBD; --sq-d:#4D795C; color-scheme:dark;
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--paper); color:var(--ink); font:400 16px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--paper); z-index:21; }
a{ color:var(--pen); }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--pen); outline-offset:2px; }
[hidden]{ display:none !important; }

/* shell */
.shell{ display:grid; grid-template-columns:minmax(0,1fr); min-height:100vh; }
.col{ min-width:0; }
.rail{ display:none; }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; padding:10px 16px; background:var(--paper); border-bottom:1px solid var(--line); }
.wordmark{ font:700 1.25rem/1 var(--serif); letter-spacing:-.01em; color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
.wordmark .fig{ width:1.35em; height:1.35em; vertical-align:middle; }
main#view{ width:100%; max-width:1120px; margin:0 auto; padding:20px 16px calc(88px + env(safe-area-inset-bottom,0px)); outline:none; }
.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
.tabs a,.tabs button{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px 9px; font-size:.72rem; font-weight:500; color:var(--ink-2); text-decoration:none; background:none; border:0; cursor:pointer; }
.tabs svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.tabs [aria-current="page"]{ color:var(--pen); }
@media (min-width:960px){
  .shell{ grid-template-columns:232px minmax(0,1fr); }
  .topbar,.tabs{ display:none; }
  .rail{ display:flex; flex-direction:column; position:sticky; top:env(safe-area-inset-top,0px); height:100vh; padding:28px 14px; border-right:1px solid var(--line); gap:1px; overflow:auto; }
  .rail .wordmark{ font-size:1.45rem; margin:0 10px 26px; }
  .rail a[data-nav]{ display:block; padding:8px 10px; border-radius:var(--r-s); color:var(--ink-2); text-decoration:none; font-weight:500; }
  .rail a[data-nav]:hover{ color:var(--ink); background:var(--line-2); }
  .rail a[aria-current="page"]{ color:var(--ink); background:var(--pen-2); }
  .rail .sep{ height:1px; background:var(--line); margin:12px 10px; }
  .rail .sync{ margin-top:auto; padding:10px; font-size:.78rem; color:var(--ink-3); }
  main#view{ padding:36px 40px 64px; }
}

/* type */
.page-head{ margin:0 0 22px; }
.kicker{ margin:0 0 6px; color:var(--ink-3); font-size:.92rem; }
h1{ font:700 clamp(2rem,4.2vw,2.75rem)/1.06 var(--serif); letter-spacing:-.018em; margin:0 0 10px; }
h2{ font:600 1.3rem/1.25 var(--serif); margin:0 0 10px; letter-spacing:-.005em; }
h3{ font:600 1rem/1.3 var(--sans); margin:0 0 6px; }
.lead{ font:italic 400 1.14rem/1.55 var(--serif); color:var(--ink-2); margin:0; max-width:60ch; }
.prose p{ font:400 1.07rem/1.7 var(--serif); margin:0 0 14px; max-width:64ch; }
.muted{ color:var(--ink-2); } .small{ font-size:.875rem; }
section{ margin:0 0 30px; }
.big-num{ font:700 2.6rem/1 var(--serif); margin:0 0 10px; font-variant-numeric:tabular-nums; }

/* controls */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:42px; padding:9px 16px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:500; cursor:pointer; text-decoration:none; }
.btn:hover{ border-color:var(--ink-3); }
.btn.primary{ background:var(--pen); border-color:var(--pen); color:var(--pen-ink); }
.btn.primary:hover{ filter:brightness(1.07); }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--pen); padding-left:10px; padding-right:10px; }
.btn.ghost:hover{ background:var(--pen-2); }
.actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center; }
.coach-btn{ display:none !important; }
body.has-coach .coach-btn{ display:inline-flex !important; }
.coach-dot{ width:8px; height:8px; border-radius:50%; background:var(--pen); flex:none; }
.seg{ display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:var(--r-s); overflow:hidden; background:var(--surface); }
.seg button{ border:0; background:transparent; padding:9px 14px; cursor:pointer; color:var(--ink-2); font-weight:500; border-right:1px solid var(--line); }
.seg button:last-child{ border-right:0; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }
.field{ margin:0 0 18px; }
.field > label,.field > .label{ display:block; font-weight:600; margin:0 0 8px; }
input[type=range]{ width:min(340px,100%); accent-color:var(--pen); }
textarea{ width:100%; min-height:150px; padding:12px; border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface); color:var(--ink); font:400 .95rem/1.5 var(--sans); resize:vertical; }
.range-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

/* board */
.play{ display:grid; gap:20px; grid-template-columns:minmax(0,1fr); align-items:start; }
.board-col{ width:100%; max-width:min(100%, calc(100vh - 250px)); min-width:250px; margin:0 auto; }
@media (min-width:900px){
  .play{ grid-template-columns:minmax(300px, min(560px, calc(100vh - 140px))) minmax(240px,1fr); }
  .board-col{ max-width:none; margin:0; }
  .play.stack{ grid-template-columns:minmax(0,1fr); }
  .play.stack .board-col{ max-width:min(440px, calc(100vh - 200px)); }
}
.board-col.small{ max-width:330px; margin:0 0 14px; }
.board{ position:relative; width:100%; aspect-ratio:1/1; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); border-radius:4px; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; box-shadow:0 0 0 1px var(--line), 0 0 0 5px var(--line-2); }
.sq{ position:relative; }
.sq.l{ background:var(--sq-l); } .sq.d{ background:var(--sq-d); }
.sq.lm::before,.sq.sel::before,.sq.chk::before,.sq.m-good::before,.sq.m-bad::before,.sq.m-hint::before,.sq.m-warn::before{ content:""; position:absolute; inset:0; }
.sq.lm::before{ background:var(--sq-lm); }
.sq.sel::before{ background:var(--sq-sel); }
.sq.m-good::before{ background:rgba(43,140,90,.55); } .sq.m-bad::before{ background:rgba(205,60,40,.55); }
.sq.m-hint::before{ background:rgba(40,80,200,.4); } .sq.m-warn::before{ background:rgba(230,160,20,.6); }
.sq.chk::before{ background:radial-gradient(circle, rgba(225,40,25,.9) 0%, rgba(225,40,25,.45) 42%, transparent 72%); }
.sq.tgt::after{ content:""; position:absolute; left:50%; top:50%; width:30%; height:30%; transform:translate(-50%,-50%); border-radius:50%; background:rgba(14,24,32,.3); z-index:3; pointer-events:none; }
.sq.cap::after{ content:""; position:absolute; inset:3%; border-radius:50%; box-shadow:inset 0 0 0 5px rgba(14,24,32,.32); z-index:3; pointer-events:none; }
.sq.hang::after{ content:""; position:absolute; inset:5%; border-radius:50%; box-shadow:inset 0 0 0 3px rgba(235,120,20,.95); z-index:3; pointer-events:none; }
.pc{ position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
.pc.moved{ animation:settle .18s ease-out; }
@keyframes settle{ from{ transform:scale(.9); opacity:.55; } to{ transform:none; opacity:1; } }
.co{ position:absolute; z-index:1; font:600 clamp(8px,1.5vw,11px)/1 var(--sans); pointer-events:none; }
.co-r{ left:3px; top:3px; } .co-f{ right:3px; bottom:2px; }
.sq.l .co{ color:var(--sq-d); } .sq.d .co{ color:var(--sq-l); }
.arrows{ position:absolute; inset:0; width:100%; height:100%; z-index:4; pointer-events:none; }
.ar line{ stroke:var(--ar); } .ar polygon{ fill:var(--ar); }
.ar-good{ --ar:rgba(30,130,80,.85); } .ar-bad{ --ar:rgba(205,55,35,.85); } .ar-hint{ --ar:rgba(40,80,200,.8); }
.drag-ghost{ position:fixed; left:0; top:0; z-index:1000; pointer-events:none; filter:drop-shadow(0 6px 8px rgba(0,0,0,.25)); }
.promo{ position:absolute; inset:0; z-index:6; display:grid; place-items:center; background:rgba(10,16,22,.5); }
.promo-row{ display:flex; gap:6px; padding:8px; border-radius:var(--r-m); background:var(--surface); }
.promo-btn{ width:clamp(46px,11vw,66px); aspect-ratio:1/1; border:1px solid var(--line); border-radius:var(--r-s); background:var(--sq-l); padding:4px; cursor:pointer; }
.promo-btn svg{ width:100%; height:100%; display:block; }
.fig{ width:1.08em; height:1.08em; vertical-align:-.18em; --pbf:currentColor; --pbs:currentColor; --pbd:transparent; }

/* side panel */
.side{ min-width:0; }
.side > h2:first-child{ margin-top:0; }
.turn-line{ display:flex; align-items:center; gap:10px; font-size:1.05rem; margin:0 0 6px; }
.swatch{ width:18px; height:18px; border-radius:50%; border:1.5px solid var(--ink); flex:none; }
.swatch.w{ background:#F8F7F2; } .swatch.b{ background:#272D34; }
.msg{ min-height:1.5em; margin:6px 0; font-weight:500; }
.msg.good{ color:var(--ok); } .msg.bad{ color:var(--flag); }
.prompt{ font:400 1.08rem/1.55 var(--serif); margin:0 0 6px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.chip{ font-size:.82rem; padding:3px 9px; border-radius:999px; background:var(--line-2); color:var(--ink-2); }
.counter{ font-variant-numeric:tabular-nums; color:var(--ink-2); margin:0 0 4px; }

/* scoresheet */
.sheet{ border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface); max-height:250px; overflow:auto; margin:12px 0; }
.sheet:empty{ display:none; }
.sheet table{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:.95rem; }
.sheet td{ padding:5px 10px; border-bottom:1px solid var(--line-2); width:45%; }
.sheet td.n{ width:10%; color:var(--ink-3); text-align:right; border-right:1px solid var(--line-2); padding-right:8px; }
.sheet .mv{ border-radius:4px; padding:1px 4px; }
.sheet .mv[role=button]{ cursor:pointer; }
.sheet .mv.cur{ background:var(--pen-2); }
.mk{ font-weight:600; margin-left:2px; } .mk-blunder{ color:var(--flag); } .mk-mistake{ color:#D0661A; } .mk-inaccuracy{ color:var(--amber); }

/* overlays */
.sheet-bg{ position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center; background:rgba(8,14,20,.45); }
.modal{ width:min(640px,100%); max-height:min(88vh,780px); overflow:auto; background:var(--surface); border-radius:var(--r-l) var(--r-l) 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px)); }
@media (min-width:720px){ .sheet-bg{ align-items:center; } .modal{ border-radius:var(--r-l); padding:24px; } }
.modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:4px; }
.modal-head h2{ margin:4px 0 0; }
.answer{ white-space:pre-wrap; font:400 1.04rem/1.65 var(--serif); padding:12px 0 4px; min-height:2em; }
.toast{ position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:80; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:var(--r-s); font-weight:500; transition:opacity .4s; max-width:calc(100% - 32px); }
.toast.out{ opacity:0; }

/* blocks */
.callout{ border:1px solid var(--line); border-left:4px solid var(--pen); border-radius:var(--r-m); background:var(--surface); padding:16px 18px; margin:0 0 24px; }
.callout h2,.callout h3{ margin-top:0; }
.callout p{ margin:0 0 8px; }
.stats{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.stat{ padding:14px 12px 12px 0; }
.stat + .stat{ border-left:1px solid var(--line); padding-left:14px; }
.stat .v{ display:block; font:600 1.6rem/1.1 var(--serif); font-variant-numeric:tabular-nums; }
.stat .k{ display:block; font-size:.82rem; color:var(--ink-2); margin-top:4px; }
.today{ display:grid; gap:30px; grid-template-columns:minmax(0,1fr); }
@media (min-width:1100px){ .today{ grid-template-columns:minmax(0,1fr) minmax(360px,440px); align-items:start; } .today-side{ position:sticky; top:24px; } }
.session .seg{ margin:4px 0 6px; }
.lesson-list{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.lesson-list li a,.lesson-link{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:13px 2px; border-bottom:1px solid var(--line); text-decoration:none; color:var(--ink); }
.lesson-link{ border-top:1px solid var(--line); }
.lesson-list li a:hover .l-title,.lesson-link:hover .l-title{ color:var(--pen); }
.l-title{ font:600 1.06rem/1.3 var(--serif); }
.l-meta{ color:var(--ink-3); font-size:.88rem; white-space:nowrap; }
.lesson-list li.done .l-meta{ color:var(--ok); }
.lesson-list li.next .l-meta{ color:var(--pen); font-weight:600; }
.module{ margin-bottom:34px; }
.keep{ border-left:3px solid var(--ok); padding:4px 0 4px 14px; margin:18px 0 26px; font:400 1.04rem/1.6 var(--serif); max-width:62ch; }
.step-head{ margin:28px 0 12px; padding-top:18px; border-top:1px solid var(--line); }
.step-n{ font-weight:600; color:var(--ink-2); font-size:.9rem; }
.quiz .q{ font:600 1.12rem/1.4 var(--serif); margin:0 0 12px; }
.opts{ display:grid; gap:8px; max-width:520px; }
.opt{ text-align:left; padding:12px 14px; border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface); cursor:pointer; display:block; width:100%; }
.opt:hover{ border-color:var(--ink-3); }
.opt.right{ border-color:var(--ok); background:var(--ok-2); }
.opt.wrong{ border-color:var(--flag); background:var(--flag-2); }
.opt-san{ font-weight:600; margin-right:8px; } .opt-text{ color:var(--ink-2); }
.explain{ margin:12px 0 0; max-width:60ch; }
.dots{ list-style:none; display:flex; flex-wrap:wrap; gap:6px 18px; padding:0; margin:-6px 0 22px; font-size:.86rem; color:var(--ink-3); counter-reset:d; }
.dots li{ display:flex; align-items:center; gap:6px; }
.dots li::before{ counter-increment:d; content:counter(d); width:20px; height:20px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:.72rem; }
.dots li.done{ color:var(--ok); }
.dots li.done::before{ background:var(--ok); border-color:var(--ok); color:var(--surface); content:"✓"; }
.dots li.cur{ color:var(--ink); font-weight:600; }
.dots li.cur::before{ border-color:var(--pen); color:var(--pen); }
.coord-target{ font:700 clamp(3rem,10vw,5rem)/1 var(--serif); margin:18px 0 6px; letter-spacing:-.02em; min-height:1em; }
.clock{ font:600 1.2rem/1 var(--sans); font-variant-numeric:tabular-nums; color:var(--ink-2); min-height:1.2em; margin:4px 0 10px; }
.weak{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.weak li{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
.progress{ height:6px; background:var(--line-2); border-radius:3px; overflow:hidden; max-width:420px; margin:0 0 20px; }
.progress .bar{ height:100%; width:0; background:var(--pen); transition:width .2s; }
.cards{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
.card{ border:1px solid var(--line); border-radius:var(--r-m); padding:16px; background:var(--surface); display:flex; flex-direction:column; gap:6px; color:inherit; text-decoration:none; }
a.card:hover{ border-color:var(--ink-3); }
.card p{ margin:0; color:var(--ink-2); }
.card .actions{ margin-top:auto; padding-top:8px; }
.table{ width:100%; border-collapse:collapse; max-width:640px; }
.table th,.table td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
.table th{ font-size:.82rem; color:var(--ink-3); font-weight:600; }
.meter{ display:inline-block; height:6px; background:var(--line-2); border-radius:3px; overflow:hidden; width:110px; vertical-align:middle; margin-right:8px; }
.meter > span{ display:block; height:100%; background:var(--ok); }
.cal{ display:grid; grid-template-columns:repeat(8,15px); grid-template-rows:repeat(7,15px); grid-auto-flow:column; gap:4px; }
.cal span{ border-radius:3px; background:var(--line-2); }
.cal span.a1{ background:#a9cdb6; } .cal span.a2{ background:#5f9f7a; } .cal span.a3{ background:var(--ok); }
.spark{ width:100%; max-width:520px; height:auto; display:block; overflow:visible; }
.spark polyline{ fill:none; stroke:var(--pen); stroke-width:2; vector-effect:non-scaling-stroke; }
.spark .mid{ stroke:var(--line); stroke-dasharray:3 3; }
.spark .gdot{ fill:var(--flag); cursor:pointer; }
.graph{ margin:12px 0; }
.cct{ border:1px solid var(--line); border-radius:var(--r-m); padding:8px 12px; margin:10px 0; background:var(--surface); }
.cct h3{ margin:4px 0; }
.cct-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.cct-row .btn{ min-height:34px; }
@media (prefers-reduced-motion:reduce){ .pc.moved{ animation:none; } .progress .bar,.toast{ transition:none; } }

</style>
</head>

<div id="app"></div>
<script>
/* Hamle Hamle — chess core (rules, notation, search). Self-contained so it can run in a Web Worker. */
function HHChessFactory() {
  'use strict';
  const PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6, BLK = 8;
  const F_CAP = 1, F_BIG = 2, F_EP = 4, F_KS = 8, F_QS = 16, F_PROMO = 32;
  const N_OFF = [-33, -31, -18, -14, 14, 18, 31, 33];

<script>
const HH_LESSONS = [{"id": "tahta", "module": 1, "title": "Tahtayı tanı", "minutes": 3, "intro": "Her karenin bir adı var. Kare adlarını hızlı okumak hem bulmacada hem de oyununu incelerken zaman kazandırır.", "body": ["Tahta sekiz dikey hat (a’dan h’ye) ve sekiz yatay sıradan (1’den 8’e) oluşur. Bir kare, hattın harfi ve sıranın sayısıyla adlandırılır: e4, f7, b2 gibi.", "Beyaz taşlar 1. ve 2. sırada, siyah taşlar 7. ve 8. sırada başlar. Vezir kendi rengindeki kareye konur: beyaz vezir d1’de, siyah vezir d8’de.", "Filler çaprazlarda, kaleler hatlarda ve sıralarda, vezir hepsinde hareket eder. Bir taşın hangi karelere ulaştığını bir bakışta görmek, taktiklerin ilk adımıdır."], "keep": "Kare adlarını sesli söyleyerek oyna: “at f3’e”, “fil c4’e”. Birkaç günde otomatikleşir.", "steps": [{"type": "demo", "fen": "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", "squares": [["e4", "hint"], ["d5", "hint"], ["f7", "warn"]], "caption": "e4 ve d5 merkez kareleri; f7 başlangıçta yalnızca şahla korunur."}, {"type": "quiz", "fen": "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", "question": "Beyaz şah başlangıçta hangi karede?", "options": ["e1", "d1", "e8", "f1"], "answer": 0, "explain": "Şah e1’de, vezir yanındaki d1’de durur."}, {"type": "drill", "kind": "coords", "seconds": 30, "caption": "Isınma: 30 saniyede gösterilen karelere dokun."}]}, {"id": "deger", "module": 1, "title": "Taşların değeri ve takas", "minutes": 4, "intro": "Takas kararlarının temeli: hangi taş kaça değer?", "body": ["Yaklaşık değerler: piyon 1, at 3, fil 3, kale 5, vezir 9. Şahın değeri ölçülemez; onu kaybetmek oyunu kaybetmektir.", "Korunmayan bir taşı almak bedavadır. Korunan bir taşı alırsan karşılığında kendi taşını verirsin; bu yüzden aldığın taş en az verdiğin kadar değerli olmalı.", "Örnek: piyonla korunan bir atı filinle almak eşit takastır (3’e 3). Aynı atı vezirinle alırsan 9 puanı 3 puana vermiş olursun."], "keep": "Almadan önce sor: “Bu taşı kim koruyor, geri alınca ne kaybederim?”", "steps": [{"type": "move", "fen": "6k1/5ppp/4p3/3n4/8/b1N5/1B3PPP/6K1 w - - 0 1", "line": ["b2a3"], "policy": "exact", "prompt": "Beyaz oynar. İki taş alabilirsin; hangisi gerçekten kâr getirir?", "hint": "d5’teki at e6 piyonuyla korunuyor. a3’teki fili kim koruyor?", "success": "Doğru: a3’teki fil korumasızdı. Axd5 ise exd5 ile eşit takas olurdu ve siyah fil b2’yi alırdı.", "accept": [["b2a3"]]}, {"type": "quiz", "question": "Kalenle, piyonla korunan bir piyonu almak iyi bir takas mı?", "options": ["Evet, bir piyon kazanırım", "Hayır, 5 puanlık kaleyi 1 puanlık piyon için veririm", "Fark etmez"], "answer": 1, "explain": "Rakip piyonla geri alır; 1 puan alıp 5 puan verirsin."}]}, {"id": "asili", "module": 1, "title": "Asılı taşlar", "minutes": 5, "intro": "Bu seviyede oyunların çoğu bir taşı korumasız bırakarak kaybedilir.", "body": ["Bir taş saldırı altındaysa ve yeterince korunmuyorsa “asılıdır”: rakip onu bedavaya ya da kârlı bir takasla alabilir.", "Saldırı altındaki taşını kurtarmanın üç yolu var: kaçır, koru ya da araya bir taş koy. Bazen en iyisi karşı saldırıdır, ama önce kaybetmemeyi düşün.", "Her hamleden sonra kendine sor: “Taşlarımın hepsi korunuyor mu? Rakibin son hamlesi neye saldırıyor?”"], "keep": "Rakibin her hamlesinden sonra ilk iş: “Neyime saldırdı?”", "steps": [{"type": "move", "fen": "r1bqkbnr/2pp1ppp/p1n5/1p2p3/2B1P3/3P1N2/PPP2PPP/RNBQK2R w KQkq - 0 5", "line": ["c4b3"], "policy": "engine", "prompt": "Siyah b5 ile filine saldırdı. Filini güvenli bir kareye götür.", "hint": "Fil c4’te piyonla saldırı altında. Güvenli bir çapraz kare bul.", "success": "Fil güvende. Rakibin piyon hamlesi bir saldırıydı; fark etmek yarım işti.", "accept": [["c4b3", "c4d5"]]}, {"type": "puzzles", "themes": ["hangingPiece"], "count": 3, "maxRating": 1150, "caption": "Şimdi tersini yap: rakibin asılı taşını al."}]}, {"id": "sat", "module": 1, "title": "Şah–Alma–Tehdit kontrolü", "minutes": 5, "intro": "Taş vermemeyi alışkanlığa çeviren üç soru.", "body": ["Hamleni seçmeden önce önce rakibin gözünden bak: Rakip bir sonraki hamlede şah çekebilir mi, bir taşımı alabilir mi, neyi tehdit ediyor?", "Sonra kendi gözünden: Benim şah çekişlerim, alışlarım ve tehditlerim neler? Zorlayıcı hamleler (şah, alma, tehdit) çoğu zaman en iyi hamlelerdir ve onları önce incelemek hesaplamayı kısaltır.", "Uygulamadaki “Kontrol modu” bu soruları oyun sırasında sana hatırlatır. Amaç bir süre sonra bunu kendiliğinden yapmak."], "keep": "Sıra: önce rakibin şah–alma–tehditleri, sonra benimkiler, sonra plan.", "steps": [{"type": "move", "fen": "r3k2r/ppp2ppp/8/8/3n4/8/PPP2PPP/R3KB1R w KQkq - 0 1", "line": ["e1c1"], "policy": "engine", "prompt": "Beyaz oynar. Önce rakibin tehdidini bul, sonra onu önleyen bir hamle yap.", "hint": "d4’teki at bir sonraki hamlede c2’ye gelirse neye saldırır?", "success": "Rakibin Ac2+ çatalı vardı: şah ve a1’deki kale aynı anda saldırı altında kalacaktı.", "accept": [["e1c1", "a1c1", "e1d2", "f1d3"]]}, {"type": "quiz", "question": "Hamleni seçmeden önce ilk sorman gereken soru hangisi?", "options": ["Rakip ne tehdit ediyor?", "En güzel hamle hangisi?", "Hangi taşımı geliştirmedim?"], "answer": 0, "explain": "Rakibin tehdidini görmeden yapılan en güzel plan bile bir taş vererek biter."}, {"type": "puzzles", "themes": ["hangingPiece", "fork"], "count": 3, "maxRating": 1150}]}, {"id": "catal", "module": 2, "title": "Çatal", "minutes": 5, "intro": "Tek taşla iki hedefe aynı anda saldırmak.", "body": ["Çatalda bir taşın iki (ya da daha fazla) rakip taşa aynı anda saldırır. Rakip ikisini birden kurtaramaz.", "En sık görülen at çatalıdır; at, kaçılması zor açılarla saldırdığı için özellikle şah çekerek yapılan çatallar güçlüdür. Piyon ve vezir de çatal yapar.", "İpucu: rakibin şahı, veziri ve kaleleri aynı atın ulaşabileceği karelerdeyse çatal ara."], "keep": "Değerli iki rakip taş aynı renkteki karelerdeyse atına bak.", "steps": [{"type": "move", "fen": "r3k3/pp3ppp/8/3N4/8/8/PP3PPP/4K3 w - - 0 1", "line": ["d5c7", "e8d7", "c7a8"], "policy": "exact", "prompt": "Beyaz oynar ve malzeme kazanır.", "hint": "At c7’ye gelirse hangi iki taşa saldırır?", "success": "Şahlı çatal: siyah önce şahını kurtarmak zorunda, kale düşer.", "accept": [["d5c7"], ["c7a8"]]}, {"type": "move", "fen": "r1bqkb1r/ppp2ppp/3n1n2/8/4P3/2N5/PPP2PPP/R1BQKB1R w KQkq - 0 1", "line": ["e4e5"], "policy": "exact", "prompt": "Beyaz oynar. Bir piyonla iki ata birden saldır.", "hint": "Piyonlar çapraz alır. e-piyonu bir kare ilerlerse neye saldırır?", "success": "Piyon çatalı: atlardan biri gidecek.", "accept": [["e4e5"]]}, {"type": "puzzles", "themes": ["fork"], "count": 3, "maxRating": 1150}]}, {"id": "acmaz", "module": 2, "title": "Açmaz", "minutes": 5, "intro": "Bir taşı, arkasındaki daha değerli taş yüzünden yerinden kıpırdayamaz hale getirmek.", "body": ["Açmazda saldırdığın taşın arkasında daha değerli bir taş (ya da şah) vardır. Öndeki taş hareket ederse arkadaki açığa çıkar.", "Şaha yapılan açmaz mutlaktır: o taş kurallar gereği oynayamaz. Fil, kale ve vezir açmaz yapabilir.", "Açmazdaki taşa ikinci kez saldır, özellikle bir piyonla: rakip onu kaçıramaz."], "keep": "Açmazdaki taş, saldırılacak taştır.", "steps": [{"type": "demo", "fen": "3rk3/pp3ppp/3p4/4n3/8/8/PPP2PPP/4R1K1 w - - 0 1", "arrows": [["e1", "e8", "bad"]], "squares": [["e5", "warn"]], "caption": "e1’deki kale, e5’teki atı e8’deki şaha açmaza almış: at oynayamaz."}, {"type": "move", "fen": "3rk3/pp3ppp/3p4/4n3/8/8/PPP2PPP/4R1K1 w - - 0 1", "line": ["f2f4"], "policy": "exact", "prompt": "Beyaz oynar. Açmazdaki taşa bir piyonla saldır ve onu kazan.", "hint": "e5’teki at kaçamıyor. Hangi piyon ona saldırabilir?", "success": "f4 ile at kurtulamaz: kaçarsa şah açığa çıkar. Açmazdaki taş, saldırılacak taştır.", "accept": [["f2f4"]]}, {"type": "puzzles", "themes": ["pin"], "count": 3, "maxRating": 1250}]}, {"id": "sis", "module": 2, "title": "Şiş", "minutes": 4, "intro": "Açmazın tersi: değerli taş önde, kaçınca arkadaki düşer.", "body": ["Şişte önce değerli taşa (çoğunlukla şaha) saldırırsın. O kaçmak zorunda kalınca arkasındaki taş açıkta kalır.", "Kale ve filler şiş için idealdir: aynı hat ya da çapraz üzerinde dizilmiş iki rakip taş gördüğünde şiş ara."], "keep": "Aynı çizgide iki rakip taş: biri şah ya da vezirse şiş fırsatı.", "steps": [{"type": "move", "fen": "4q3/6pp/8/4k3/8/8/6PP/K6R w - - 0 1", "line": ["h1e1", "e5f4", "e1e8"], "policy": "exact", "prompt": "Beyaz oynar ve veziri kazanır.", "hint": "Şah ve vezir aynı hatta. Önce şaha şah çek.", "success": "Şah kaçtı, arkasındaki vezir düştü.", "accept": [["h1e1"], ["e1e8"]]}, {"type": "puzzles", "themes": ["skewer"], "count": 3, "maxRating": 1350}]}, {"id": "acarak", "module": 2, "title": "Açarak saldırı", "minutes": 5, "intro": "Bir taş çekilir, arkasındaki hat açılır: iki tehdit birden.", "body": ["Kale, fil ya da vezirin önündeki kendi taşını çektiğinde, arkadaki taşın hattı açılır. Çekilen taş da bir yere saldırırsa rakip iki tehdide aynı anda cevap veremez.", "Çekilen taş şah çekerse buna açarak şah denir; rakip önce şahını kurtarmak zorundadır, arkadaki saldırı karşılıksız kalır."], "keep": "Kendi taşlarının arkasında saklı duran kale, fil ve vezirlere bak.", "steps": [{"type": "move", "fen": "3qk3/pp3ppp/8/8/8/3B4/PP3PPP/3QK3 w - - 0 1", "line": ["d3b5", "e8e7"], "policy": "exact", "finishAuto": false, "prompt": "Beyaz oynar. Fili şah çekerek çek ve vezirin hattını aç.", "hint": "Fil hangi kareden e8’deki şaha şah çeker?", "success": "Açarak şah: siyah şahını kurtarırken d8’deki vezir korumasız kalır.", "accept": [["d3b5"]]}, {"type": "puzzles", "themes": ["discoveredAttack"], "count": 3, "maxRating": 1350}]}, {"id": "koridor", "module": 2, "title": "Koridor matı", "minutes": 5, "intro": "Rok yapmış şahın önündeki piyonlar kaçış karelerini kapatır.", "body": ["Şah, önündeki üç piyonun arkasında güvende görünür ama arka sıraya gelen bir kale ya da vezir mat edebilir: şahın kaçacak karesi yoktur.", "Korunmak için uygun bir anda h3 (siyahla h6) gibi bir “hava deliği” aç ya da arka sırayı bir kaleyle koru."], "keep": "Arka sıran zayıfsa saldırıdan önce bir hava deliği aç.", "steps": [{"type": "move", "fen": "6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1", "line": ["d1d8"], "policy": "mate", "prompt": "Beyaz oynar ve tek hamlede mat eder.", "hint": "Siyah şahın önündeki piyonlar onu hapsediyor.", "success": "Koridor matı.", "accept": [["d1d8"]]}, {"type": "move", "fen": "3r2k1/R4ppp/8/8/8/8/5PPP/6K1 w - - 0 1", "line": ["h2h3"], "policy": "engine", "prompt": "Beyaz oynar. Siyahın tehdidini durdur.", "hint": "Siyah kale d1’e gelirse ne olur?", "success": "Tehdit ...Kd1 matıydı. Hava deliği ya da arka sırayı korumak işe yarar.", "accept": [["h2h3", "a7a1", "f2f3", "f2f4", "g1f1", "g2g3", "g2g4", "h2h4"]]}, {"type": "puzzles", "themes": ["backRankMate"], "count": 3, "maxRating": 1350}]}, {"id": "savunan", "module": 2, "title": "Savunanı kaldır, saptır", "minutes": 5, "intro": "Bir taş bir şeyi koruyorsa, o korumayı ortadan kaldır.", "body": ["Bazı taşlar kritik bir kareyi ya da başka bir taşı korur. O koruyucuyu alırsan (savunanı ortadan kaldırma) ya da onu başka bir göreve çekersen (saptırma), koruduğu şey düşer.", "Soru şu: “Rakibin bu taşı neyi koruyor? O olmasa ne olurdu?”"], "keep": "Kritik kareyi koruyan taşı bul; onu al ya da uzaklaştır.", "steps": [{"type": "move", "fen": "r1b2rk1/pp3ppp/2n2n2/6B1/7Q/3B4/PPP2PPP/R4RK1 w - - 0 1", "line": ["g5f6"], "policy": "exact", "prompt": "Beyaz oynar. h7’yi koruyan taşı ortadan kaldır.", "hint": "Vezir ve fil h7’ye bakıyor. Onu kim savunuyor?", "success": "f6’daki at h7’yi koruyordu. Gidince Vxh7 matı tehdidi durdurulamaz.", "accept": [["g5f6"]]}, {"type": "puzzles", "themes": ["capturingDefender", "deflection"], "count": 3, "maxRating": 1400}]}, {"id": "matlar", "module": 2, "title": "Mat kalıpları", "minutes": 6, "intro": "Kalıbı tanıyan, hesabı kısa keser.", "body": ["Mat ararken önce şah çeken hamlelere bak. Rakip şahın kaçış karelerini say: hepsi kapalı ya da kontrol altındaysa mat yakındır.", "Sık kalıplar: koridor matı, destekli vezirin şahın dibine gelmesi, kale ve atla Arap matı, kendi taşlarıyla çevrili şaha atla yapılan boğmaca mat."], "keep": "Önce şahlar: rakip şahın kaçış karelerini say.", "steps": [{"type": "demo", "fen": "6rk/5Npp/8/8/8/8/8/6K1 b - - 0 1", "squares": [["h8", "bad"]], "caption": "Boğmaca mat: şah kendi taşları yüzünden kaçamıyor, at mat ediyor."}, {"type": "puzzles", "themes": ["mateIn1"], "count": 3, "maxRating": 1000}, {"type": "puzzles", "themes": ["mateIn2"], "count": 2, "maxRating": 1350}]}, {"id": "vs", "module": 3, "title": "Vezir ve şahla mat", "minutes": 6, "intro": "Avantajı sonuca çevirmenin ilk becerisi.", "body": ["Veziri rakip şahtan bir at sıçrayışı uzağa koy: şahı bir “kutuya” hapseder. Şah hareket ettikçe veziri aynı şekilde yaklaştırıp kutuyu küçült.", "Şah kenara sıkışınca veziri bir an bekletip kendi şahını getir. Vezir tek başına mat edemez, şahın desteği gerekir.", "Pat’a dikkat: rakip şahın hiç hamlesi kalmazsa ama şah altında değilse oyun berabere biter."], "keep": "Kutu küçülürken her hamlede “rakip şahın bir hamlesi kaldı mı?” diye bak.", "steps": [{"type": "quiz", "fen": "7k/5Q2/6K1/8/8/8/8/8 b - - 0 1", "question": "Siyah oynar. Bu pozisyonun sonucu ne?", "options": ["Beyaz kazandı, mat", "Berabere, pat", "Siyah vezir alabilir"], "answer": 1, "explain": "Siyah şah altında değil ama gidecek karesi yok: pat."}, {"type": "move", "fen": "7k/8/6K1/8/8/8/8/5Q2 w - - 0 1", "line": ["f1f8"], "policy": "mate", "prompt": "Beyaz oynar ve mat eder. Dikkat: bir vezir hamlesi pat yapar.", "hint": "Ve7? ya da Vf7? siyah şaha hiç kare bırakmaz ama şah çekmez.", "success": "Mat. Vf7 olsaydı pat olurdu.", "accept": [["f1f8"]]}, {"type": "drill", "kind": "endgame", "id": "kqk", "caption": "Şimdi bota karşı baştan sona mat et."}]}, {"id": "ks", "module": 3, "title": "Kale ve şahla mat", "minutes": 6, "intro": "Daha uzun ama aynı fikir: hapset, yaklaş, mat et.", "body": ["Kaleyle rakip şahı bir sıraya ya da hatta hapset. Kendi şahını rakip şahın karşısına getir (aralarında bir kare kalacak şekilde).", "Şahlar karşı karşıyayken kaleyle kenardan şah çek: rakip şah geri çekilmek zorunda kalır. Karşı karşıya gelmiyorsa kaleyle bir bekleme hamlesi yap.", "Kaleni rakip şahın yanına bırakma: korumasız kale alınır."], "keep": "Şahlar karşı karşıya, kale kenardan şah çeker.", "steps": [{"type": "move", "fen": "4k3/8/4K3/8/8/8/8/R7 w - - 0 1", "line": ["a1a8"], "policy": "mate", "prompt": "Beyaz oynar ve mat eder.", "hint": "Şahlar karşı karşıya. Kale arka sıradan şah çekerse?", "success": "Klasik kale matı.", "accept": [["a1a8"]]}, {"type": "drill", "kind": "endgame", "id": "krk", "caption": "Bota karşı kale ve şahla mat et."}]}, {"id": "merdiven", "module": 3, "title": "İki kaleyle merdiven matı", "minutes": 4, "intro": "En hızlı mat: iki ağır taş sırayla şah çeker.", "body": ["Bir kale bir sırayı keserken diğeri bir sonraki sıradan şah çeker. Rakip şah her seferinde bir sıra geri itilir ve kenarda mat olur.", "Rakip şah kalelerinden birine yaklaşırsa o kaleyi tahtanın öbür ucuna götür, sonra merdivene devam et."], "keep": "Kaleler birbirini engellemesin: biri keser, öbürü şah çeker.", "steps": [{"type": "move", "fen": "8/4k3/R7/8/8/8/8/6KR w - - 0 1", "line": ["h1h7", "e7f8", "a6a8"], "policy": "exact", "prompt": "Beyaz oynar ve iki hamlede mat eder.", "hint": "a6’daki kale 6. sırayı kesiyor. Diğer kale 7. sıradan şah çeksin.", "success": "Merdiven matı.", "accept": [["h1h7"], ["a6a8"]]}, {"type": "drill", "kind": "endgame", "id": "rrk", "caption": "Bota karşı merdiven matı."}]}, {"id": "kare", "module": 3, "title": "Kare kuralı", "minutes": 4, "intro": "Şah, kaçan piyonu yakalayabilir mi? Saymadan bil.", "body": ["Piyondan terfi edeceği sıraya kadar bir kare çiz (piyonun bulunduğu sıradan son sıraya, o kadar da yana). Rakip şah, sıra kendindeyken bu karenin içine girebiliyorsa piyonu yakalar.", "Piyon henüz başlangıç sırasındaysa iki kare gidebileceği için kareyi bir itle": "Pat tuzağı", "minutes": 4, "intro": "Kazanılmış oyunun en acı sonu.", "body": ["Rakip şah şah altında değilken hiçbir yasal hamlesi kalmazsa oyun pat ile berabere biter. Çok önde olan taraf aceleyle bunu sık yapar.", "Mat ararken her hamlede rakip şaha en az bir kare bırakıp bırakmadığına bak. Emin değilsen önce kendi şahını yaklaştır."], "keep": "Matı bulamıyorsan bile rakibe bir hamle bırak.", "steps": [{"type": "move", "fen": "k7/8/1K6/8/8/8/8/2Q5 w - - 0 1", "line": ["c1c8"], "policy": "mate", "prompt": "Beyaz oynar ve mat eder. Bir hamle pat yapar.", "hint": "Vc7 siyah şaha hiç hamle bırakmaz ama şah çekmez.", "success": "Mat. Vc7 pat olurdu.", "accept": [["c1c8"]]}, {"type": "quiz", "fen": "k7/1R6/1K6/8/8/8/8/8 b - - 0 1", "question": "Siyah oynar. Sonuç ne?", "options": ["Siyah kaleyi alır", "Berabere, pat", "Mat"], "answer": 1, "explain": "b7’deki kale şahla korunduğu için alınamaz; a7 ve b8 de kontrol altında. Siyah şah altında değil ama hamlesi yok: pat."}]}, {"id": "prensip", "module": 4, "title": "Açılış prensipleri", "minutes": 5, "intro": "İlk on hamlede ezber değil, üç iş: merkez, gelişim, rok.", "body": ["Merkezi piyonlarla tut (e4, d4; siyahla e5, d5). Atları ve filleri ilk hamlelerde oyuna sok. Şahını rokla güvenceye al, sonra kalelerini birbirine bağla.", "Kaçın: veziri erken çıkarmak (rakip ona saldırarak tempo kazanır), aynı taşı nedensiz iki kez oynamak, kenar piyonlarıyla vakit kaybetmek, f-piyonunu erken oynayıp şahını açmak."], "keep": "Her açılış hamlesinde sor: merkez mi, gelişim mi, şah güvenliği mi?", "steps": [{"type": "quiz", "fen": "rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", "question": "Beyaz oynar. Prensiplere en uygun hamle hangisi?", "options": [{"san": "Nf3", "text": "at gelişir, e5’e saldırır"}, {"san": "Qh5", "text": "vezir erken çıkar"}, {"san": "h4", "text": "kenar piyonu"}], "answer": 0, "explain": "Af3 hem gelişir hem merkezdeki piyona saldırır."}, {"type": "quiz", "fen": "r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4", "question": "Beyaz oynar. Hangisi?", "options": [{"san": "O-O", "text": "şahı güvenceye al"}, {"san": "Ng5", "text": "aynı atı ikinci kez oyna"}, {"san": "Rg1", "text": "kaleyi oynat, rok hakkını kaybet"}], "answer": 0, "explain": "Rok hem şahı korur hem kaleyi oyuna yaklaştırır. Ag5 aynı atı ikinci kez oynar, Kg1 ise rok hakkını boşa harcar."}, {"type": "quiz", "fen": "rnbqkbnr/ppp1pppp/8/3p4/2PP4/8/PP2PPPP/RNBQKBNR b KQkq - 0 2", "question": "Siyah oynar. Hangisi?", "options": [{"san": "e6", "text": "merkezi destekle, fili aç"}, {"san": "Qd6", "text": "vezir erken çıkar"}, {"san": "h5", "text": "kenar piyonu"}], "answer": 0, "explain": "...e6, d5’i destekler ve f8’deki filin yolunu açar."}]}, {"id": "tuzak", "module": 4, "title": "Erken mat tuzakları", "minutes": 5, "intro": "Çoban matı ve benzerlerinden korunmak.", "body": ["f7 (beyazda f2) başlangıçta yalnızca şahla korunur. Fil c4 ve vezir h5 ya da f3 birlikte f7’ye saldırırsa Vxf7 mat tehdidi doğar: buna çoban matı denir.", "Savunma: f7’yi koruyan sağlam bir hamle yap (...g6, ...Ve7 ya da ...Vf6), sonra veziri tempo kazanarak kovala (...Af6 gibi). Erken çıkan vezir, iyi savunulunca bir yük olur."], "keep": "Vezir ve fil aynı zayıf kareye bakıyorsa önce o kareyi koru.", "steps": [{"type": "demo", "fen": "r1bqkb1r/pppp1Qpp/2n2n2/4p3/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 0 4", "squares": [["f7", "bad"]], "arrows": [["c4", "f7", "bad"]], "caption": "Çoban matı: f7’deki vezir filin desteğiyle mat ediyor."}, {"type": "move", "fen": "r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3", "line": ["g7g6", "h5f3", "g8f6"], "policy": "engine", "prompt": "Siyah oynar. Hem f7’yi hem e5’i düşün.", "hint": "Vezir h5’ten f7’ye ve e5’e bakıyor. ...Af6? Vxf7 mat olur.", "success": "Önce koru, sonra gelişirken savun. Vezir boşa zaman harcadı.", "accept": [["g7g6", "d8e7", "d8f6", "g8h6"], ["g8f6", "d8e7", "d8f6", "f7f5", "g8h6"]]}]}, {"id": "plan", "module": 5, "title": " function openMore() { const m = modal('Diğer bölümler'); ['oyunsonu', 'gorus', 'acilis', 'analiz', 'ilerleme', 'ayarlar'].forEach((id) => m.append(h('a', { class: 'lesson-link', href: '#' + id, onclick: () => m.close() }, h('span', { class: 'l-title', text: NAV_LABEL[id] }), h('span', { class: 'l-meta', text: NAV_DESC[id] })))); }
function buildShell() {
  const app = $('#app'); app.className = 'shell';
  const mark = () => h('a', { class: 'wordmark', href: '#bugun', html: '<svg class="fig" viewBox="0 0 45 45" aria-hidden="true"><use href="#p-bN"/></svg>Hamle Hamle' });
  const rail = h('nav', { class: 'rail', 'aria-label': 'Bölümler' }, mark());
  [['bugun', 'bulmaca', 'dersler', 'oyna'], ['oyunsonu', 'gorus', 'acilis', 'analiz'], ['ilerleme', 'ayarlar']].forEach((g, gi) => { if (gi) rail.append(h('div', { class: 'sep' })); g.forEach((id) => rail.append(h('a', { href: '#' + id, 'data-nav': id, text: NAV_LABEL[id] }))); });
  rail.append(h('p', { class: 'sync', id: 'sync-note' }));
  const tabs = h('nav', { class: 'tabs', 'aria-label': 'Ana bölümler' }, ['bugun', 'bulmaca', 'dersler', 'oyna'].map((id) => h('a', { href: '#' + id, 'data-nav': id, html: ICON[id] + `<span>${{ bugun: 'Bugün', bulmaca: 'Bulmaca', dersler: 'Dersler', oyna: 'Oyna' }[id]}</span>` })), h('button', { type: 'button', 'data-nav': 'diger', html: ICON.diger + '<span>Diğer</span>', onclick: openMore }));
  app.append(rail, h('div', { class: 'col' }, h('header', { class: 'topbar' }, mark()), h('main', { id: 'view', tabindex: '-1' })), tabs);
}
function init() {
  Store.load();
  document.body.insertAdjacentHTML('afterbegin', SPRITE);
  buildShell(); render();
  window.addEventListener('hashchange', render);
  Store.connect().then((changed) => { if (changed) render(); else { const sn = $('#sync-note'); if (sn) sn.textContent = Store.mode === 'cloud' ? 'İlerleme hesabına kayıtlı' : 'İlerleme bu tarayıcıda'; } });
  Coach.init();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flush(); });
}
